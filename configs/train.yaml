# Training config for football object detection (players / ball / referee / goalkeeper).
# Consumed by scripts/train.py, which passes `train` straight to ultralytics.

dataset:
  # MOT-format tracking data converted via scripts/convert_mot_to_yolo.py into dataset/.
  url: ""                      # zip URL of the dataset (unused; conversion is local)
  path: dataset                # dataset root, must contain data.yaml
  data_yaml: dataset/data.yaml
  expected_classes:            # prepare_data.py fails loudly if data.yaml disagrees
    0: ball
    1: goalkeeper
    2: player
    3: referee
    4: other

model:
  weights: yolo26n.pt          # starting checkpoint
  task: detect

train:
  # v1/v2/v3 were run as a raw model.train(...) call in a Kaggle notebook
  # (device=[0,1], multi-GPU), not through scripts/train.py - this file documents
  # the CURRENT recipe (v3: 20 epochs, mixup on) for reference, but
  # editing it alone won't affect a future Kaggle run unless that notebook cell is
  # updated too.
  epochs: 100
  imgsz: 640
  batch: 16
  device: 0                    # 0 | 0,1 | cpu
  workers: 8
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  patience: 25
  seed: 0
  deterministic: true
  amp: true
  val: true
  plots: true
  project: runs/detect
  name: football
  exist_ok: true

  # --- augmentation ---
  # Small fast-moving ball => keep scale/translate lively, keep flips cheap,
  # avoid vertical flip (pitch footage is never upside down). mixup was turned
  # on for v3 alongside the extra epochs (10 -> 20); ball AP went +23% on the
  # test split vs v1, though the two changes weren't isolated so the gain can't
  # be attributed to mixup alone. Matches the actual v3 Kaggle call.
  #
  # copy_paste is NOT used: it requires per-instance segmentation masks
  # (ultralytics no-ops it when instances only carry boxes - see
  # augment.py CopyPaste.__call__), and this dataset is bbox-only
  # (detection, not segmentation). Setting copy_paste > 0 here would do
  # nothing but suggest otherwise.
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.7
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  bgr: 0.0
  mosaic: 1.0
  mixup: 0.1
  cutmix: 0.0
  auto_augment: randomaugment
  erasing: 0.4
  close_mosaic: 10             # disable mosaic for the final N epochs

export:
  # scripts/export_onnx.py --weights <ckpt> [--quantize 16|8 --data dataset/data.yaml]
  # output name tracks the checkpoint: football_detection_v1.pt -> football_detection_v1[_fp16|_int8].onnx
  opset: 12
  dynamic_batch: true
  simplify: true

quantize:
  # int8 calibration is done by ultralytics (ORT static quant) at export time:
  #   --split train --fraction 0.01  (~345 of 34.5k train images)
  #
  # No max_map_drop gate is declared here yet. Measured drops so far (v1 nano
  # 0.027, v2 small 0.064, v3 nano 0.033) are from short (10-20 epoch) runs, so
  # a target picked now would just be reverse-engineered from numbers we
  # already know fail it. scripts/eval_map.py's --compare-to/--max-map-drop
  # gate still works (pass a value on the CLI) - this repo just isn't
  # publishing a specific bar as "the" gate until a fully-trained model's
  # numbers justify setting one for real.

# Serving is env-var driven (MODELS=, DEFAULT_BACKEND=, ... - see app/main.py /
# README's Serving section), not config-file driven. There used to be a `serve:`
# block here; nothing ever read it, so it's gone rather than left to mislead.
