# Training config for football object detection (players / ball / referee / goalkeeper).
# Consumed by scripts/train.py, which passes `train` straight to ultralytics.

dataset:
  # MOT-format tracking data converted via scripts/convert_mot_to_yolo.py into dataset/.
  url: ""                      # zip URL of the dataset (unused; conversion is local)
  path: dataset                # dataset root, must contain data.yaml
  data_yaml: dataset/data.yaml
  expected_classes:            # prepare_data.py fails loudly if data.yaml disagrees
    0: ball
    1: goalkeeper
    2: player
    3: referee
    4: other

model:
  weights: yolo26n.pt          # starting checkpoint
  task: detect

train:
  # The values below are the v3 recipe (fast preset: nano, 640, 20 epochs, mixup on), taken from the training
  # arguments stored inside models/football_detection_v3.pt (there: device 0,1, project football_detection, name
  # football_detection_v3, exist_ok False, copy_paste 0.3 as a no-op, see below). They stay
  # at 640 on purpose: train.imgsz is also the fallback input size for export_onnx.py, eval_map.py and benchmark.py,
  # so raising it here would silently change those. Every run, v1 to v13, was launched as a raw model.train(...)
  # call in a Kaggle notebook (device=[0,1]), not through scripts/train.py, so editing this file alone does not
  # change a Kaggle run: the notebook cell is the source of truth.
  #
  # What the later runs changed (read from each run's checkpoint; results in README / reports/):
  #
  #   run  model     imgsz  epochs         batch  scale  mixup  close_mosaic  optimizer         preset
  #   v3   yolo26n    640    20              16    0.7    0.1       10        auto              fast
  #   v7   yolo26n    960    20              16    0.5    0.0        5        MuSGD             balanced
  #   v6   yolo26n   1280    30, stopped 25  16    0.7    0.1       10        MuSGD             accurate (best = epoch 15)
  #   v10  yolo26n   1280    25, time=9.5    16    0.7    0.1        7        MuSGD             (v6 recipe, copy_paste 0 not 0.3; not served)
  #   v13  yolo26s   1280    12, time=4.5    12    0.7    0.1        3        AdamW, lr0 0.001111  max (best = epoch 7)
  #
  # v3 stored optimizer=auto, which ultralytics resolves when training starts; the later runs stored what it chose.
  # For v13 the run was started with epochs=10 and `time=4.5` (hours); `time` overrides `epochs` in ultralytics,
  # which then rewrote it to the 12 epochs that fit. v7 and later also spell auto_augment `randaugment`, v3
  # `randomaugment` (the same RandAugment). Resolution and model size were the two levers that moved test accuracy;
  # loss weighting, tuning, longer schedules and a P2 head did not (README, "v9 to v13").
  # export_onnx.py needs --imgsz <trained size> for any model not trained at 640; eval_map.py and benchmark.py read
  # the size from the model's .meta.json sidecar (or the checkpoint) instead.
  epochs: 20
  imgsz: 640
  batch: 16
  device: 0                    # 0 | 0,1 | cpu
  workers: 8
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false
  patience: 100
  seed: 0
  deterministic: true
  amp: true
  val: true
  plots: true
  project: runs/detect
  name: football
  exist_ok: true

  # --- augmentation ---
  # Small fast-moving ball => keep scale/translate lively, keep flips cheap,
  # avoid vertical flip (pitch footage is never upside down). mixup was turned
  # on for v3 alongside the extra epochs (10 -> 20); ball AP went +22% on the
  # test split vs v1, though the two changes weren't isolated so the gain can't
  # be attributed to mixup alone. The augmentation keys below match what v3's checkpoint recorded, except copy_paste.
  #
  # copy_paste has no effect here (v3 and v6 were launched with 0.3, v1, v2, v7, v10 and v13 recorded 0; it is left at 0 below): it requires per-instance segmentation masks
  # (ultralytics no-ops it when instances only carry boxes - see
  # augment.py CopyPaste.__call__), and this dataset is bbox-only
  # (detection, not segmentation). Setting copy_paste > 0 here would do
  # nothing but suggest otherwise.
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.7
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  bgr: 0.0
  mosaic: 1.0
  mixup: 0.1
  cutmix: 0.0
  auto_augment: randomaugment
  erasing: 0.4
  close_mosaic: 10             # disable mosaic for the final N epochs

export:
  # scripts/export_onnx.py --weights <ckpt> [--quantize 16|8 --data dataset/data.yaml]
  # output name tracks the checkpoint: football_detection_v1.pt -> football_detection_v1[_fp16|_int8].onnx
  opset: 12
  dynamic_batch: true
  simplify: true

quantize:
  # int8 calibration is done by ultralytics (ORT static quant) at export time,
  # against scripts/build_calibration_set.py's output (345 images, stratified
  # across all 46 training sequences), NOT a raw --fraction slice of --split
  # train: ultralytics sorts that list alphabetically before slicing, which -
  # given our <sequence>_<frame>.jpg naming - took the first ~345 frames of
  # one ~14s clip. See scripts/build_calibration_set.py's docstring.
  #
  # No max_map_drop gate is declared here yet. Measured drops so far (v1 nano
  # 0.027, v2 small 0.064, v3 nano 0.033) are from BEFORE this fix (single-clip
  # calibration) and from short (10-20 epoch) runs - both need re-measuring
  # against the new calibration set before either is trustworthy. Only v6
  # (1280 px, 0.046) was quantized with the stratified set. A target
  # picked now would just be reverse-engineered from numbers we already know
  # are questionable. scripts/eval_map.py's --compare-to/--max-map-drop
  # gate still works (pass a value on the CLI) - this repo just isn't
  # publishing a specific bar as "the" gate until a fully-trained model's
  # numbers justify setting one for real.

# Serving is env-var driven (MODELS=, DEFAULT_BACKEND=, ... - see app/main.py /
# README's Serving section), not config-file driven. There used to be a `serve:`
# block here; it is gone, and the scripts that once looked it up now use their
# own defaults (conf 0.25, iou 0.45, max_det 300) directly.
