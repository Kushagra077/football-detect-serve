# Training config for football object detection (players / ball / referee / goalkeeper).
# Consumed by scripts/train.py, which passes `train` straight to ultralytics.

dataset:
  # SoccerNet MOT data converted via scripts/convert_mot_to_yolo.py into dataset/.
  url: ""                      # zip URL of the dataset (unused; conversion is local)
  path: dataset                # dataset root, must contain data.yaml
  data_yaml: dataset/data.yaml
  expected_classes:            # prepare_data.py fails loudly if data.yaml disagrees
    0: ball
    1: goalkeeper
    2: player
    3: referee
    4: other

model:
  weights: yolo26n.pt          # starting checkpoint
  task: detect

train:
  epochs: 100
  imgsz: 640
  batch: 16
  device: 0                    # 0 | 0,1 | cpu
  workers: 8
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  patience: 25
  seed: 0
  deterministic: true
  amp: true
  val: true
  plots: true
  project: runs/detect
  name: football
  exist_ok: true

  # --- augmentation ---
  # Small fast-moving ball => keep scale/translate lively, keep flips cheap,
  # avoid vertical flip (pitch footage is never upside down).
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 10             # disable mosaic for the final N epochs

export:
  # scripts/export_onnx.py --weights <ckpt> [--quantize 16|8 --data dataset/data.yaml]
  # output name tracks the checkpoint: football_detection_v1.pt -> football_detection_v1[_fp16|_int8].onnx
  opset: 12
  dynamic_batch: true
  simplify: true

quantize:
  # int8 calibration is done by ultralytics (ORT static quant) at export time:
  #   --split train --fraction 0.01  (~345 of 34.5k train images)
  # int8 accuracy gate: mAP50-95 "degraded but sane, not collapse". max_map_drop is
  # a scaffold guess kept until the final (30+ epoch) weights fix a real number;
  # measured 10-epoch drop was 0.027 (nano) / 0.064 (small). See PROGRESS.md.
  max_map_drop: 0.02

serve:
  backend: onnx                # torch | onnx
  weights: models/football_detection_v1.onnx
  imgsz: 640
  conf: 0.25
  iou: 0.45
  max_det: 300
  batch:
    max_batch_size: 8
    max_wait_ms: 15
