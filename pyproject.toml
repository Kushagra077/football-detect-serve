[project]
name = "football-detect-serve"
version = "0.1.0"
description = "Football object detection (YOLO26 -> ONNX -> INT8) served behind a batching FastAPI service"
readme = "README.md"
requires-python = ">=3.13"
# Full local-dev environment (this file, via `uv sync`): training, data-fetch
# tooling (kaggle/pytubefix/yt-dlp) and experiment tracking (wandb/weave) on
# top of everything serving needs. requirements.txt is the separate, smaller,
# deliberately-unpinned list that Docker/CI actually install from - it only
# carries what app/ + scripts/ + tests/ import. The two are meant to differ;
# see requirements.txt's own header comments for what's excluded and why.
dependencies = [
    "fastapi>=0.141.1",
    "gradio>=6.26.0",
    "kaggle>=2.2.4",
    "locust>=2.46.4",
    "httpx",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxslim>=0.1.96",
    "prometheus-client>=0.26.0",
    "pytest",
    "pytest-asyncio",
    "python-multipart>=0.0.32",
    "pytubefix>=10.11.0",
    "spaces",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.126",
    "uvicorn[standard]>=0.52.4",
    "wandb>=0.28.2",
    "weave>=0.53.6",
    "yt-dlp>=2026.8.19",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
